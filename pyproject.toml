[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refusal-lab"
version = "0.1.0"
description = "Learning project: find and ablate the refusal direction in open-weight chat models (Arditi et al., 2024)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "transformers>=4.44",
    "datasets>=2.18",
    "matplotlib>=3.7",
    "tqdm>=4.66",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "jupyter"]

[project.scripts]
refusal-lab = "refusal_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
